<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#1c5fd6" />
<title>구술 형성평가</title>
<style>
  :root{
    --blue:#1c5fd6;
    --blue-dark:#164aa8;
    --blue-light:#eaf1fd;
    --red:#d63a2f;
    --green:#1a7f4b;
    --gray:#5b6472;
    --line:#d9dee8;
    --bg:#f5f7fb;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background:var(--bg);color:#1a1f2b;
    font-size:17px;line-height:1.5;
    padding:12px 12px 32px;
    max-width:720px;margin:0 auto;
    -webkit-text-size-adjust:100%;
  }
  h1{font-size:20px;margin:0 0 2px;letter-spacing:-.3px;}
  .sub{color:var(--gray);font-size:14px;margin:0 0 14px;}
  .card{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:12px;
    box-shadow:0 1px 2px rgba(20,30,60,.04);
  }
  .card h2{font-size:15px;margin:0 0 10px;color:var(--gray);font-weight:600;}
  .eval-name{
    display:inline-block;background:var(--blue-light);color:var(--blue-dark);
    font-weight:700;font-size:15px;border-radius:999px;padding:4px 12px;margin-bottom:10px;
  }
  .question{font-size:19px;font-weight:600;letter-spacing:-.2px;margin:0 0 8px;}
  .meta{font-size:14px;color:var(--gray);}
  .meta span+span:before{content:"·";margin:0 6px;color:#b9c0cc;}

  /* ---------- 입력 ---------- */
  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  label{display:block;font-size:14px;font-weight:600;color:var(--gray);margin-bottom:6px;}
  input[type=text],input[type=tel]{
    width:100%;padding:14px 14px;font-size:20px;font-weight:600;
    border:2px solid var(--line);border-radius:12px;background:#fff;
    color:#1a1f2b;outline:none;letter-spacing:1px;
  }
  input:focus{border-color:var(--blue);background:#fbfdff;}
  input::placeholder{color:#b9c0cc;font-weight:400;letter-spacing:0;}

  /* ---------- 버튼 ---------- */
  button{
    font-family:inherit;font-size:19px;font-weight:700;
    border:none;border-radius:14px;padding:18px 16px;width:100%;
    cursor:pointer;transition:transform .06s, background .15s;
    min-height:60px;
  }
  button:active:not(:disabled){transform:scale(.985);}
  button:disabled{opacity:.45;cursor:not-allowed;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:active:not(:disabled){background:var(--blue-dark);}
  .btn-record{background:var(--red);color:#fff;font-size:21px;}
  .btn-stop{background:#2b2f38;color:#fff;font-size:21px;}
  .btn-ghost{background:#fff;color:var(--blue);border:2px solid var(--blue);}
  .btn-row{display:flex;gap:10px;}
  .btn-row button{flex:1;}

  /* ---------- 녹음 ---------- */
  .rec-wrap{text-align:center;}
  .timer{
    font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;
    letter-spacing:1px;margin:6px 0 2px;color:#1a1f2b;
  }
  .timer.warn{color:var(--red);}
  .timer small{font-size:16px;font-weight:600;color:var(--gray);margin-left:6px;}
  .gauge{
    height:16px;background:#e8ecf4;border-radius:999px;overflow:hidden;margin:12px 0 18px;
  }
  .gauge > i{
    display:block;height:100%;width:0%;border-radius:999px;
    background:linear-gradient(90deg,#3aa76d,#7bd389 55%,#f2c14e 80%,#e2574c);
    transition:width .08s linear;
  }
  .rec-hint{font-size:14px;color:var(--gray);margin:0 0 14px;min-height:20px;}
  .rec-dot{
    display:inline-block;width:11px;height:11px;border-radius:50%;
    background:var(--red);margin-right:6px;vertical-align:middle;
    animation:blink 1s infinite;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  audio{width:100%;margin-top:6px;}

  /* ---------- 상태 ---------- */
  .box{
    border-radius:12px;padding:14px 16px;font-size:16px;margin-top:12px;
    display:none;white-space:pre-line;
  }
  .box.show{display:block;}
  .box.err{background:#fdeceb;color:#8f1d14;border:1px solid #f6c6c1;}
  .box.ok{background:#e8f6ee;color:#125c37;border:1px solid #bde5cd;}
  .box.info{background:var(--blue-light);color:var(--blue-dark);border:1px solid #c6d9f8;}
  .box b{font-weight:800;}

  /* ---------- 로딩 ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(18,26,45,.55);
    display:none;align-items:center;justify-content:center;padding:24px;z-index:50;
  }
  .overlay.show{display:flex;}
  .overlay .panel{
    background:#fff;border-radius:20px;padding:28px 24px;text-align:center;
    max-width:360px;width:100%;
  }
  .spinner{
    width:46px;height:46px;border:5px solid #dfe6f2;border-top-color:var(--blue);
    border-radius:50%;margin:0 auto 16px;animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .overlay p{margin:0;font-size:17px;font-weight:600;}
  .overlay .small{font-size:14px;font-weight:400;color:var(--gray);margin-top:8px;}

  .hidden{display:none !important;}
  .foot{text-align:center;color:#98a1b0;font-size:12px;margin-top:18px;line-height:1.6;}
  .setup{margin-top:40px;text-align:center;}
  .setup code{background:#eef2f9;padding:2px 6px;border-radius:6px;font-size:14px;}
  @media (min-width:600px){
    body{padding:20px 20px 40px;}
    .question{font-size:22px;}
    .timer{font-size:56px;}
  }
</style>
</head>
<body>

<h1>구술 형성평가</h1>
<p class="sub">말로 답하고, 제출 버튼을 누르세요.</p>

<!-- API 주소가 없을 때 -->
<div id="setupView" class="card setup hidden">
  <h2 style="color:var(--red)">주소가 올바르지 않습니다</h2>
  <p>선생님이 알려 준 링크를 다시 확인해 주세요.</p>
  <p style="font-size:14px;color:var(--gray)">
    링크 끝에 <code>?api=https://script.google.com/…/exec</code> 가 붙어 있어야 합니다.
  </p>
</div>

<!-- 정상 화면 -->
<div id="mainView" class="hidden">

  <!-- 1. 평가 정보 -->
  <div class="card">
    <h2>오늘의 평가</h2>
    <div class="eval-name" id="evalName">불러오는 중…</div>
    <p class="question" id="question">&nbsp;</p>
    <p class="meta">
      <span id="subjectMeta"></span><span id="maxMeta"></span>
    </p>
  </div>

  <!-- 2. 학생 정보 -->
  <div class="card">
    <h2>나의 정보</h2>
    <div class="field">
      <label for="studentId">학번</label>
      <input id="studentId" type="tel" inputmode="numeric" autocomplete="off"
             maxlength="12" placeholder="예) 10101" />
    </div>
    <div class="field">
      <label for="classCode">수업 코드 (4자리)</label>
      <input id="classCode" type="tel" inputmode="numeric" autocomplete="off"
             maxlength="4" placeholder="예) 1234" />
    </div>
  </div>

  <!-- 3. 녹음 -->
  <div class="card">
    <h2>녹음하기</h2>
    <div class="rec-wrap">
      <div class="timer" id="timer">00:00<small id="timerLimit"></small></div>
      <div class="gauge"><i id="gauge"></i></div>
      <p class="rec-hint" id="recHint">마이크 버튼을 누르면 녹음이 시작됩니다.</p>

      <button id="btnRecord" class="btn-record">🎤 녹음 시작</button>

      <div id="previewArea" class="hidden">
        <audio id="preview" controls playsinline preload="metadata"></audio>
        <div class="btn-row" style="margin-top:14px">
          <button id="btnRetry" class="btn-ghost">다시 녹음</button>
          <button id="btnSubmit" class="btn-primary">제출하기</button>
        </div>
      </div>
    </div>
    <div id="status" class="box"></div>
  </div>

  <p class="foot" id="footNote">
    녹음 파일은 채점 후 선생님이 정리합니다.<br>제출이 안 되면 화면을 새로 고친 뒤 다시 해 보세요.
  </p>
</div>

<!-- 로딩 -->
<div class="overlay" id="overlay">
  <div class="panel">
    <div class="spinner"></div>
    <p id="overlayText">녹음을 올리고 있어요…</p>
    <p class="small">잠시만 기다려 주세요. 창을 닫지 마세요.</p>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =======================================================================
   *  0. 설정값
   * ===================================================================== */
  var params  = new URLSearchParams(window.location.search);
  var API_URL = (params.get('api') || '').trim();

  var MIME_CANDIDATES = [
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/mp4'
  ];

  var state = {
    evaluationName: '',
    question: '',
    subject: '',
    maxSeconds: 60,
    mediaRecorder: null,
    stream: null,
    audioCtx: null,
    analyser: null,
    gaugeRAF: 0,
    chunks: [],
    blob: null,
    blobUrl: '',
    mimeType: '',
    startedAt: 0,
    tickTimer: 0,
    isRecording: false,
    isSubmitting: false,
    wakeLock: null
  };

  /* =======================================================================
   *  1. 화면 요소
   * ===================================================================== */
  var el = {
    setupView:   document.getElementById('setupView'),
    mainView:    document.getElementById('mainView'),
    evalName:    document.getElementById('evalName'),
    question:    document.getElementById('question'),
    subjectMeta: document.getElementById('subjectMeta'),
    maxMeta:     document.getElementById('maxMeta'),
    studentId:   document.getElementById('studentId'),
    classCode:   document.getElementById('classCode'),
    timer:       document.getElementById('timer'),
    timerLimit:  document.getElementById('timerLimit'),
    gauge:       document.getElementById('gauge'),
    recHint:     document.getElementById('recHint'),
    btnRecord:   document.getElementById('btnRecord'),
    previewArea: document.getElementById('previewArea'),
    preview:     document.getElementById('preview'),
    btnRetry:    document.getElementById('btnRetry'),
    btnSubmit:   document.getElementById('btnSubmit'),
    status:      document.getElementById('status'),
    overlay:     document.getElementById('overlay'),
    overlayText: document.getElementById('overlayText')
  };

  /* =======================================================================
   *  2. 공통 유틸
   * ===================================================================== */
  function showStatus(kind, message) {
    el.status.className = 'box show ' + kind;
    el.status.textContent = message;
  }
  function hideStatus() {
    el.status.className = 'box';
    el.status.textContent = '';
  }
  function showOverlay(text) {
    el.overlayText.textContent = text || '처리 중입니다…';
    el.overlay.classList.add('show');
  }
  function hideOverlay() {
    el.overlay.classList.remove('show');
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function fmtClock(sec) {
    sec = Math.max(0, Math.floor(sec));
    return pad2(Math.floor(sec / 60)) + ':' + pad2(sec % 60);
  }
  function setTimer(sec) {
    el.timer.innerHTML = fmtClock(sec) + '<small id="timerLimit">/ ' + fmtClock(state.maxSeconds) + '</small>';
    el.timerLimit = document.getElementById('timerLimit');
    el.timer.classList.toggle('warn', (state.maxSeconds - sec) <= 10);
  }

  /* =======================================================================
   *  3. 평가 정보 불러오기 (GET)
   * ===================================================================== */
  function loadEvaluation() {
    el.evalName.textContent = '불러오는 중…';
    el.question.textContent = '';

    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var timerId = setTimeout(function () { if (ctrl) ctrl.abort(); }, 15000);

    fetch(API_URL, { method: 'GET', signal: ctrl ? ctrl.signal : undefined })
      .then(function (res) { return res.text(); })
      .then(function (text) {
        var data;
        try { data = JSON.parse(text); }
        catch (e) { throw new Error('서버 응답을 읽지 못했습니다. 선생님께 알려 주세요.'); }

        if (!data.ok) {
          el.evalName.textContent = '평가 없음';
          el.question.textContent = data.message || '지금은 열려 있는 평가가 없습니다.';
          el.btnRecord.disabled = true;
          showStatus('err', data.message || '지금은 열려 있는 평가가 없습니다.');
          return;
        }

        state.evaluationName = data.evaluationName || '';
        state.question       = data.question || '';
        state.subject        = data.subject || '';
        state.maxSeconds     = Number(data.maxSeconds) || 60;

        el.evalName.textContent = state.evaluationName || '평가';
        el.question.textContent = state.question || '(문항이 비어 있습니다. 선생님께 알려 주세요.)';
        el.subjectMeta.textContent = state.subject ? ('교과 ' + state.subject) : '';
        el.maxMeta.textContent = '최대 ' + state.maxSeconds + '초';
        setTimer(0);
      })
      .catch(function (err) {
        el.evalName.textContent = '연결 실패';
        el.question.textContent = '평가 정보를 불러오지 못했습니다.';
        el.btnRecord.disabled = true;
        showStatus('err',
          '서버에 연결하지 못했습니다.\n' +
          (err && err.name === 'AbortError' ? '응답이 너무 늦습니다. 인터넷 상태를 확인하고 화면을 새로 고쳐 주세요.' : '인터넷 상태를 확인한 뒤 화면을 새로 고쳐 주세요.'));
      })
      .then(function () { clearTimeout(timerId); });
  }

  /* =======================================================================
   *  4. 마이크 / 녹음
   * ===================================================================== */
  function pickMimeType() {
    if (typeof MediaRecorder === 'undefined') return '';
    if (!window.MediaRecorder.isTypeSupported) return '';
    for (var i = 0; i < MIME_CANDIDATES.length; i++) {
      if (MediaRecorder.isTypeSupported(MIME_CANDIDATES[i])) return MIME_CANDIDATES[i];
    }
    return '';   // 브라우저 기본값 사용
  }

  function getMicrophone() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return Promise.reject(new Error('이 브라우저는 녹음을 지원하지 않습니다. 크롬이나 사파리를 최신으로 업데이트해 주세요.'));
    }
    return navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }
    });
  }

  function startVolumeMeter(stream) {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      state.audioCtx = new Ctx();
      var src = state.audioCtx.createMediaStreamSource(stream);
      state.analyser = state.audioCtx.createAnalyser();
      state.analyser.fftSize = 1024;
      state.analyser.smoothingTimeConstant = 0.6;
      src.connect(state.analyser);
      var buf = new Uint8Array(state.analyser.fftSize);

      var loop = function () {
        if (!state.analyser) return;
        state.analyser.getByteTimeDomainData(buf);
        var sum = 0;
        for (var i = 0; i < buf.length; i++) {
          var v = (buf[i] - 128) / 128;
          sum += v * v;
        }
        var rms = Math.sqrt(sum / buf.length);
        var level = Math.min(100, Math.round(rms * 260));   // 보기 좋게 증폭
        el.gauge.style.width = level + '%';
        state.gaugeRAF = requestAnimationFrame(loop);
      };
      loop();
    } catch (e) {
      // 볼륨 게이지는 없어도 녹음은 계속한다
    }
  }

  function stopVolumeMeter() {
    if (state.gaugeRAF) cancelAnimationFrame(state.gaugeRAF);
    state.gaugeRAF = 0;
    el.gauge.style.width = '0%';
    if (state.audioCtx) {
      try { state.audioCtx.close(); } catch (e) {}
      state.audioCtx = null;
      state.analyser = null;
    }
  }

  function startTimer() {
    state.startedAt = Date.now();
    setTimer(0);
    state.tickTimer = setInterval(function () {
      var elapsed = (Date.now() - state.startedAt) / 1000;
      setTimer(elapsed);
      if (elapsed >= state.maxSeconds) {
        stopRecording(true);   // 시간이 다 되면 자동 정지
      }
    }, 100);
  }

  function stopTimer() {
    if (state.tickTimer) clearInterval(state.tickTimer);
    state.tickTimer = 0;
  }

  function startRecording() {
    if (state.isRecording || state.isSubmitting) return;
    hideStatus();

    var mime = pickMimeType();

    getMicrophone().then(function (stream) {
      state.stream = stream;
      state.chunks = [];
      state.blob = null;
      state.mimeType = mime;

      var options = {};
      if (mime) options.mimeType = mime;
      if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported &&
          MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
        options.audioBitsPerSecond = 32000;   // 60초 ≈ 240KB, 음성 인식엔 충분
      }

      try {
        state.mediaRecorder = new MediaRecorder(stream, options);
      } catch (e) {
        try {
          state.mediaRecorder = new MediaRecorder(stream);   // 옵션 없이 재시도
        } catch (e2) {
          showStatus('err', '이 브라우저에서는 녹음을 시작할 수 없습니다. 선생님께 알려 주세요.');
          releaseStream();
          return;
        }
      }

      state.mediaRecorder.ondataavailable = function (ev) {
        if (ev.data && ev.data.size > 0) state.chunks.push(ev.data);
      };
      state.mediaRecorder.onstop = function () {
        var type = state.mediaRecorder.mimeType || state.mimeType || 'audio/webm';
        state.blob = new Blob(state.chunks, { type: type });
        state.mimeType = type.split(';')[0];
        if (state.blob.size === 0) {
          showStatus('err', '녹음된 소리가 없습니다. 마이크에 대고 다시 말해 보세요.');
        } else {
          showPreview();
        }
        releaseStream();
      };
      state.mediaRecorder.onerror = function () {
        showStatus('err', '녹음 중 문제가 생겼습니다. 다시 시도해 주세요.');
        stopRecording(false);
      };

      state.mediaRecorder.start(1000);   // 1초마다 조각을 모아 안정적으로 저장

      state.isRecording = true;
      el.btnRecord.textContent = '⏹ 녹음 끝내기';
      el.btnRecord.className = 'btn-stop';
      el.recHint.innerHTML = '<span class="rec-dot"></span>녹음 중입니다. 또박또박 말해 보세요.';
      el.previewArea.classList.add('hidden');

      startTimer();
      startVolumeMeter(stream);
      requestWakeLock();
    }).catch(function (err) {
      var name = (err && err.name) || '';
      if (name === 'NotAllowedError' || name === 'SecurityError') {
        showStatus('err',
          '마이크 사용이 막혀 있습니다.\n' +
          '· 주소창 옆 자물쇠(또는 ⓘ) 아이콘 → 마이크 → "허용"으로 바꿔 주세요.\n' +
          '· 아이패드/아이폰은 설정 → Safari → 마이크 → "확인"으로 바꿔 주세요.\n' +
          '· 그래도 안 되면 화면을 새로 고쳐 다시 시도해 주세요.');
      } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
        showStatus('err', '마이크를 찾지 못했습니다. 이어폰 마이크를 빼거나 다른 태블릿으로 시도해 주세요.');
      } else if (name === 'NotReadableError') {
        showStatus('err', '다른 앱이 마이크를 쓰고 있습니다. 그 앱을 닫고 다시 시도해 주세요.');
      } else {
        showStatus('err', '마이크를 켜지 못했습니다. (' + (err && err.message ? err.message : '알 수 없는 오류') + ')');
      }
    });
  }

  function stopRecording(isAuto) {
    if (!state.isRecording) return;
    try {
      if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') {
        state.mediaRecorder.stop();
      }
    } catch (e) {}
    state.isRecording = false;
    stopTimer();
    stopVolumeMeter();
    releaseWakeLock();

    el.btnRecord.textContent = '🎤 녹음 시작';
    el.btnRecord.className = 'btn-record';
    el.recHint.textContent = isAuto
      ? '시간이 다 되어 자동으로 멈췄습니다. 들어 보고 괜찮으면 제출하세요.'
      : '녹음을 멈췄습니다. 들어 보고 괜찮으면 제출하세요.';
    setTimer((Date.now() - state.startedAt) / 1000);
  }

  function releaseStream() {
    if (state.stream) {
      state.stream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) {} });
      state.stream = null;
    }
  }

  function showPreview() {
    if (state.blobUrl) { URL.revokeObjectURL(state.blobUrl); }
    state.blobUrl = URL.createObjectURL(state.blob);
    el.preview.src = state.blobUrl;
    el.previewArea.classList.remove('hidden');
    el.btnSubmit.disabled = false;
    el.btnSubmit.textContent = '제출하기';
  }

  function resetRecording() {
    if (state.isRecording) stopRecording(false);
    if (state.blobUrl) { URL.revokeObjectURL(state.blobUrl); state.blobUrl = ''; }
    state.blob = null;
    state.chunks = [];
    el.preview.removeAttribute('src');
    el.previewArea.classList.add('hidden');
    el.recHint.textContent = '마이크 버튼을 누르면 녹음이 시작됩니다.';
    setTimer(0);
    hideStatus();
  }

  /* 화면 꺼짐 방지 (지원하는 브라우저만) */
  function requestWakeLock() {
    try {
      if ('wakeLock' in navigator && navigator.wakeLock.request) {
        navigator.wakeLock.request('screen').then(function (lock) {
          state.wakeLock = lock;
        }).catch(function () {});
      }
    } catch (e) {}
  }
  function releaseWakeLock() {
    try {
      if (state.wakeLock) { state.wakeLock.release(); state.wakeLock = null; }
    } catch (e) {}
  }

  /* =======================================================================
   *  5. 제출
   * ===================================================================== */
  function blobToBase64(blob) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onloadend = function () {
        var result = String(reader.result || '');
        var comma = result.indexOf(',');
        if (comma < 0) { reject(new Error('파일을 읽지 못했습니다.')); return; }
        resolve(result.substring(comma + 1));
      };
      reader.onerror = function () { reject(new Error('파일을 읽지 못했습니다.')); };
      reader.readAsDataURL(blob);
    });
  }

  function validateInput() {
    var sid = el.studentId.value.trim();
    var code = el.classCode.value.trim();

    if (!sid) {
      showStatus('err', '학번을 입력해 주세요.');
      el.studentId.focus();
      return null;
    }
    if (!/^[0-9A-Za-z-]{3,20}$/.test(sid)) {
      showStatus('err', '학번은 숫자로 입력해 주세요. (예: 10101)');
      el.studentId.focus();
      return null;
    }
    if (!code) {
      showStatus('err', '수업 코드 4자리를 입력해 주세요.');
      el.classCode.focus();
      return null;
    }
    if (!/^[0-9]{4}$/.test(code)) {
      showStatus('err', '수업 코드는 숫자 4자리입니다. 칠판을 다시 확인해 주세요.');
      el.classCode.focus();
      return null;
    }
    return { studentId: sid, classCode: code };
  }

  function submit() {
    if (state.isSubmitting) return;
    if (!state.blob) {
      showStatus('err', '먼저 녹음해 주세요.');
      return;
    }
    var input = validateInput();
    if (!input) return;

    state.isSubmitting = true;
    el.btnSubmit.disabled = true;
    el.btnRetry.disabled = true;
    el.btnRecord.disabled = true;
    showOverlay('답변을 보내고 채점하는 중이에요…');
    hideStatus();

    blobToBase64(state.blob).then(function (b64) {
      var payload = {
        studentId: input.studentId,
        classCode: input.classCode,
        audioBase64: b64,
        mimeType: state.mimeType || 'audio/webm'
      };

      var ctrl = ('AbortController' in window) ? new AbortController() : null;
      var timerId = setTimeout(function () { if (ctrl) ctrl.abort(); }, 120000);

      // ★ text/plain 으로 보내야 Apps Script에서 CORS 사전요청(preflight) 오류가 나지 않는다.
      return fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
        signal: ctrl ? ctrl.signal : undefined
      }).then(function (res) {
        clearTimeout(timerId);
        return res.text();
      }).catch(function (err) {
        clearTimeout(timerId);
        throw err;
      });
    }).then(function (text) {
      var data;
      try { data = JSON.parse(text); }
      catch (e) {
        throw new Error('서버 응답을 읽지 못했습니다. 잠시 후 다시 제출해 주세요.');
      }

      if (!data.ok) {
        var msg = data.message || '제출하지 못했습니다.';
        if (data.code === 'CLASS_CODE') {
          msg = '수업 코드가 올바르지 않습니다.\n칠판에 적힌 4자리를 다시 확인해 주세요.';
        } else if (data.code === 'STUDENT_ID') {
          msg = data.message || '학번을 찾지 못했습니다. 학번을 다시 확인해 주세요.';
        }
        showStatus('err', msg);
        el.btnSubmit.disabled = false;
        el.btnRetry.disabled = false;
        el.classCode.select();
        return;
      }

      // 성공 → 다음 학생을 위해 입력칸과 녹음을 비운다 (성공 안내는 남긴다)
      var okMsg = '✅ ' + (data.message || '제출되었습니다. 수고했어요!');
      if (state.blobUrl) { URL.revokeObjectURL(state.blobUrl); state.blobUrl = ''; }
      state.blob = null;
      state.chunks = [];
      el.preview.removeAttribute('src');
      el.previewArea.classList.add('hidden');
      el.studentId.value = '';
      el.classCode.value = '';
      el.btnSubmit.textContent = '제출하기';
      el.btnSubmit.disabled = true;
      el.btnRetry.disabled = false;
      setTimer(0);
      el.recHint.textContent = '다음 학생은 학번·수업 코드를 넣고 🎤 녹음 시작을 누르세요.';
      showStatus('ok', okMsg);
    }).catch(function (err) {
      var isAbort = err && err.name === 'AbortError';
      showStatus('err', isAbort
        ? '채점이 오래 걸려 연결이 끊겼습니다.\n선생님께 알리고, 잠시 뒤 다시 제출해 보세요. (이미 저장되었을 수 있습니다.)'
        : '서버에 보내지 못했습니다. 인터넷을 확인하고 다시 제출해 주세요.\n(' + (err && err.message ? err.message : '연결 오류') + ')');
      el.btnSubmit.disabled = false;
      el.btnRetry.disabled = false;
    }).then(function () {
      state.isSubmitting = false;
      el.btnRecord.disabled = false;
      hideOverlay();
    });
  }

  /* =======================================================================
   *  6. 이벤트 연결
   * ===================================================================== */
  function bind() {
    el.btnRecord.addEventListener('click', function () {
      if (state.isRecording) stopRecording(false);
      else startRecording();
    });

    el.btnRetry.addEventListener('click', function () {
      resetRecording();
      el.btnRecord.disabled = false;
    });

    el.btnSubmit.addEventListener('click', submit);

    // 수업 코드는 숫자만, 4자리에서 자동으로 넘어감
    el.classCode.addEventListener('input', function () {
      this.value = this.value.replace(/[^0-9]/g, '').slice(0, 4);
    });
    el.studentId.addEventListener('input', function () {
      this.value = this.value.replace(/[^0-9A-Za-z-]/g, '');
    });

    // 학번 입력 후 엔터 → 수업 코드로
    el.studentId.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); el.classCode.focus(); }
    });
    el.classCode.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); el.classCode.blur(); }
    });

    // 화면을 벗어날 때 마이크 정리
    window.addEventListener('pagehide', function () {
      stopTimer();
      releaseStream();
      releaseWakeLock();
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && state.isRecording) {
        // 화면이 꺼지면 일부 브라우저가 녹음을 멈춘다 → 안내만 한다
        el.recHint.innerHTML = '<span class="rec-dot"></span>녹음 중입니다. 화면을 끄지 마세요.';
      }
    });
  }

  /* =======================================================================
   *  7. 시작
   * ===================================================================== */
  function init() {
    if (!API_URL || API_URL.indexOf('http') !== 0) {
      el.setupView.classList.remove('hidden');
      el.mainView.classList.add('hidden');
      return;
    }
    el.setupView.classList.add('hidden');
    el.mainView.classList.remove('hidden');

    if (typeof MediaRecorder === 'undefined') {
      showStatus('err', '이 브라우저는 녹음을 지원하지 않습니다.\n크롬(안드로이드) 또는 사파리(iOS 14.3 이상)를 최신으로 업데이트해 주세요.');
      el.btnRecord.disabled = true;
    }

    bind();
    setTimer(0);
    loadEvaluation();
  }

  init();
})();
</script>
</body>
</html>
